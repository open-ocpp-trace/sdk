name: TypeScript

# Branch protection requires only `ci-result`. It always reports, so a
# pull request that does not touch the TypeScript workspace or the
# conformance corpus still gets a green required check.
on:
  # No `branches` filter: stacked pull requests target other branches.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes the previous run; runs on main
  # are kept so every merged commit is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the pull request's base branch must be
          # reachable for the three-dot diff below.
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Filter changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          typescript=false
          conformance=false
          if [ "$EVENT_NAME" != pull_request ]; then
            # Pushes to main run everything.
            typescript=true
            conformance=true
          else
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            printf 'Changed files:\n%s\n' "$changed"
            while IFS= read -r path; do
              case "$path" in
                typescript/*) typescript=true ;;
                conformance/* | .github/workflows/typescript.yml)
                  typescript=true
                  conformance=true
                  ;;
              esac
            done <<EOF
          $changed
          EOF
          fi
          echo "typescript=$typescript" >> "$GITHUB_OUTPUT"
          echo "conformance=$conformance" >> "$GITHUB_OUTPUT"
          echo "typescript=$typescript conformance=$conformance"

  shellcheck:
    name: Shellcheck shell scripts
    needs: changes
    if: needs.changes.outputs.conformance == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version && shellcheck conformance/fetch.sh typescript/scripts/smoke-consumer.sh

  typescript:
    name: TypeScript (Node.js ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the lowest Node.js line the workspace supports.
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the conformance corpus
        working-directory: .
        run: conformance/fetch.sh
      # Bun comes from `packageManager` in typescript/package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: typescript/package.json
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: typescript
          node-version: ${{ matrix.node }}
          # Use the Bun installed above, not a Vite+-managed one.
          package-manager: |
            bun: false
          # The install below is explicitly frozen.
          run-install: false
          cache: true
          cache-dependency-path: bun.lock
      - name: Check the Bun and Node.js versions
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          expected="$(node -p 'require("./package.json").packageManager')"
          actual="bun@$(bun --version)"
          echo "packageManager=$expected bun=$actual node=$(node --version)"
          [ "$actual" = "$expected" ]
          [ "$(node -p 'process.versions.node.split(".")[0]')" = "$NODE_MAJOR" ]
      - run: bun install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp run -r pack

  smoke:
    name: Clean-consumer smoke test
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun comes from `packageManager` in typescript/package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: typescript/package.json
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: typescript
          # The lowest Node.js line the workspace supports.
          node-version: '22'
          package-manager: |
            bun: false
          run-install: false
          cache: true
          cache-dependency-path: bun.lock
      - name: Check the Bun and Node.js versions
        run: |
          expected="$(node -p 'require("./package.json").packageManager')"
          actual="bun@$(bun --version)"
          echo "packageManager=$expected bun=$actual node=$(node --version)"
          [ "$actual" = "$expected" ]
          [ "$(node -p 'process.versions.node.split(".")[0]')" = 22 ]
      - run: bun install --frozen-lockfile
      # Packs core and jsonl as published, checks the tarballs (contents,
      # publint, attw), installs them with npm into a project
      # outside the workspace, imports them under Node.js and Bun and
      # type-checks a TypeScript consumer. This is `vp run smoke`, called
      # directly so that the consumer runs on the `node` checked above
      # rather than on a Node.js that `vp run` may manage itself.
      - run: sh scripts/smoke-consumer.sh

  ci-result:
    name: ci-result
    needs: [changes, shellcheck, typescript, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A job skipped by the path filter is fine; a failed or cancelled
      # one is not.
      - name: Check needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a needed job ended with '$result'"
                exit 1
                ;;
            esac
          done
